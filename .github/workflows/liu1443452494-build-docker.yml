name: 自用 Docker 镜像
run-name: Docker 镜像构建 · ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 构建版本，以 v 开头，例如 v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: liu1443452494-docker
  cancel-in-progress: false

env:
  BUILD_VERSION: ${{ inputs.version }}
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  docker:
    name: 构建并发布 Docker amd64 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取得源码
        uses: actions/checkout@v7

      - name: 准备隔离 Python 工具
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 校验版本并应用补丁
        id: prepare
        run: uv run --no-project --python 3.14 python liu1443452494-patches/build.py prepare

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: 准备 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: 准备 just
        uses: extractions/setup-just@v4

      - name: 安装隔离测试依赖
        run: just _ci-sync-python

      - name: 检查 Python 格式和类型
        run: just lint typecheck

      - name: 验证补丁逻辑
        env:
          BUILD_TEST_TEMP: ${{ runner.temp }}/amane-custom-tests
        run: uv run --frozen python liu1443452494-patches/build.py test

      - name: 安装前端依赖
        run: just _web-install-ci

      - name: 生成补丁对应的前端类型
        run: just generate

      - name: 检查前端
        run: just check-web

      - name: 准备 Docker 构建器
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/amane:${{ steps.prepare.outputs.docker_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/amane:latest
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=liu1443452494-amane-amd64
          cache-to: type=gha,scope=liu1443452494-amane-amd64,mode=max
